name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build (Release, warnings as errors)
        run: dotnet build SessionPad.sln -c Release -warnaserror

      - name: Test (Release)
        run: dotnet test SessionPad.sln -c Release --no-build --verbosity normal

      - name: Test release scripts
        shell: pwsh
        run: scripts/test-release-scripts.ps1

      - name: Smoke-test release packaging
        shell: pwsh
        run: scripts/package-release.ps1 -Version 0.5.0-beta.99-ci -FrameworkDependent
